name: Deploy to Netlify

on:
  push:
    branches:
      - main
      - claude/website-stage-assessment-u5izfg
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 5e55ee09-19ee-4fc6-bd29-f04215ad19fe
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check for Netlify token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not set."
            echo "Create a token at https://app.netlify.com/user/applications (Personal access tokens)"
            echo "then add it at Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `netlify deploy --build` runs the build through Netlify's build system
      # locally in CI (netlify.toml + @netlify/plugin-nextjs), then uploads the
      # result to the hometown-serenity-preview site.
      - name: Build and deploy
        run: npx -y netlify-cli@latest deploy --build --prod
